<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 280" role="img" aria-labelledby="title desc">
  <title id="title">صورة ترويجية لتَيَامُن</title>
  <desc id="desc">رمز اتجاه نص مجرد مع أسطر عربية وإنجليزية متوازنة دون كلمات</desc>
  <defs>
    <linearGradient id="field" x1="18" y1="18" x2="420" y2="270" gradientUnits="userSpaceOnUse">
      <stop stop-color="#123C5A"/>
      <stop offset="0.52" stop-color="#0C2D45"/>
      <stop offset="1" stop-color="#071D2D"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="93" x2="0" y2="188" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFD166"/>
      <stop offset="1" stop-color="#F5A623"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(340 55) rotate(119) scale(230 270)" gradientUnits="userSpaceOnUse">
