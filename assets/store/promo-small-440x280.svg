  <rect width="440" height="280" fill="url(#field)"/>
  <rect width="440" height="280" fill="url(#glow)"/>
  <circle cx="381" cy="35" r="78" fill="none" stroke="#BDEDE8" stroke-opacity=".13" stroke-width="20"/>
  <circle cx="45" cy="252" r="86" fill="none" stroke="#FFD166" stroke-opacity=".12" stroke-width="22"/>

  <g opacity=".75">
    <path d="M281 75H390" stroke="#F7FBFC" stroke-width="10" stroke-linecap="round"/>
    <path d="M315 98H390" stroke="#BDEDE8" stroke-width="10" stroke-linecap="round"/>
    <path d="M261 121H390" stroke="#F7FBFC" stroke-width="10" stroke-linecap="round"/>
    <rect x="401" y="65" width="7" height="66" rx="3.5" fill="#FFD166"/>
  </g>
  <g opacity=".28">
    <path d="M258 173H346" stroke="#BDEDE8" stroke-width="8" stroke-linecap="round"/>
