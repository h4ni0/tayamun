<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">صورة ترويجية عريضة لتَيَامُن</title>
  <desc id="desc">مساحة زرقاء عميقة يتوسطها رمز نص مضبوط إلى اليمين تحيط به كتل أسطر مجردة</desc>
